# Proof of Reason validator worker. Deployed in Phase 2B by following docs/DEPLOY_RUNBOOK.md.
# Production hostname: api.proofofreason.com (zone proofofreason.com, docs/MONAD.md section 7).
# Public configuration only. Secrets, set with `wrangler secret put`, never as vars:
#   VALIDATOR_KEY  the verdict signing key
#   MONAD_RPC_URL  the archive-capable RPC URL (QuickNode or Tenderly Node); it carries a token
name = "proof-of-reason"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# @x402/hono uses the Node Buffer global when it settles a payment.
compatibility_flags = ["nodejs_compat"]
# Serve only the production hostname, not a *.workers.dev URL.
workers_dev = false
routes = [
  { pattern = "api.proofofreason.com", custom_domain = true },
]

[vars]
# Filled in during 2B from the DeployVault / DeployGate logs and DJ's USDC receiving address.
GATE_ADDRESS = "0x8fF582f268aB8E2148B548Aa061c5273bC383120"
VAULT_ADDRESS = "0x28900B0B2DDA5d2d61cDF17BE8b7091206a04Bf9"
PAY_TO = "0xA6Ad9B6e390979c8e4BA9c7Eb7cFd701dE1F9275"
# Interim ERC-8004 Validation Registry, from the DeployRegistry log in runbook step 6.
REGISTRY_ADDRESS = "0x8e2b835d43bB93cE46CcA9994f41596dB162007C"

[[kv_namespaces]]
binding = "RECEIPTS"
# Filled in during 2B from `pnpm exec wrangler kv namespace create RECEIPTS`.
id = "f2856a81b0e644c0b09538fd4430db4a"
